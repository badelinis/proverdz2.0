
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Сертификаты для GigaChat
        run: |
          mkdir -p cert
          if [ ! -f cert/russian_ca.crt ]; then
            curl -fsSL https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt -o /tmp/root.crt || true
            curl -fsSL https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt -o /tmp/sub.crt || true
            if [ -s /tmp/root.crt ] && [ -s /tmp/sub.crt ]; then
              cat /tmp/root.crt /tmp/sub.crt > cert/russian_ca.crt
            fi
          fi

      - run: npm install

      - run: npx cap add android

      - name: Настройка Android
        run: |
          M=android/app/src/main/AndroidManifest.xml
          RES=android/app/src/main/res
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' "$M"
          if [ -f cert/russian_ca.crt ] && grep -q "BEGIN CERTIFICATE" cert/russian_ca.crt; then
            mkdir -p "$RES/xml" "$RES/raw"
            cp android-res/network_security_config.xml "$RES/xml/"
            cp cert/russian_ca.crt "$RES/raw/russian_ca.crt"
            sed -i 's#<application#<application android:networkSecurityConfig="@xml/network_security_config"#' "$M"
          fi

      - run: npx cap sync android

      - name: Сборка APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: proverdz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
